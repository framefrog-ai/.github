      <g transform="rotate(240)"><path d="M0 0 L0 -86 C 12 -64 18 -38 12 -14 L6 -4 Z" fill="#10B981" fill-opacity="0.03"/><path d="M0 0 L3 -80" stroke="#64748B" stroke-width="0.8" opacity="0.6"/></g>
